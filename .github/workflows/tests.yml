# Same command as on the author's PC: test.ps1 (dotnet test, xUnit v3). Actions pinned by commit SHA; Dependabot
# (github-actions) keeps them up to date.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes the running check pointless: cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: test.ps1 (engine against a fake Gmail API, sign-in against a fake Google, setup, get.ps1)
        shell: pwsh
        run: ./test.ps1
